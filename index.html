<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEP Link - North East People Platform</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a73e8">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f7fb;color:#222}
header{background:#1a73e8;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
.container{max-width:900px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn{background:#1a73e8;color:#fff;border:0;padding:12px 18px;border-radius:8px;width:100%;font-size:15px;font-weight:bold;cursor:pointer}
.btn2{background:#e8f0fe;color:#1a73e8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
input,select,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:6px 0}
label{font-weight:bold;font-size:13px}
.postItem{border:1px solid #eee;padding:12px;border-radius:8px;margin-bottom:10px;background:#fafbff}
</style>
</head>
<body>
<header>
<h2>NEP Link - PUBLIC</h2>
<p>Everyone can see your posts now!</p>
</header>

<div class="container">
<div class="card">
<h3>🏠 Post Your Room / Product</h3>
<label>Title (e.g. 1RK)</label>
<input id="title" placeholder="e.g. 1RK Room for Rent">
<label>Description</label>
<textarea id="desc" placeholder="Govt meter, water 24x7"></textarea>
<div class="grid">
<div><label>Area</label><input id="area" placeholder="Marani Bagh"></div>
<div><label>Rent / Price</label><input id="price" placeholder="6000/month"></div>
</div>
<label>Google Maps Link</label>
<input id="maplink" placeholder="Paste Google Maps link">
<button class="btn btn2" type="button" onclick="getGPS()">📍 Get GPS Pin</button>
<p id="gpsText" style="font-size:12px;color:green;margin:6px 0"></p>
<label>UPI ID (Required)</label>
<input id="upi" placeholder="yourname@okaxis">
<label>Phone</label>
<input id="phone" placeholder="9876543210">
<br>
<button class="btn" id="postBtn" type="button">Post Now For Everyone</button>
<p id="status" style="text-align:center;margin-top:10px;font-weight:bold"></p>
</div>

<div class="card">
<h3>🌍 LIVE Posts From All Users</h3>
<div id="postsList">Loading...</div>
</div>
</div>

<script type="module">
// ===== PASTE YOUR FIREBASE CONFIG HERE - REPLACE THIS WHOLE OBJECT =====
const firebaseConfig = {
  apiKey: "REPLACE_WITH_YOUR_API_KEY",
  authDomain: "REPLACE_WITH_YOUR_PROJECT.firebaseapp.com",
  projectId: "REPLACE_WITH_YOUR_PROJECT_ID",
  storageBucket: "REPLACE_WITH_YOUR_PROJECT.appspot.com",
  messagingSenderId: "REPLACE_WITH_YOUR_SENDER_ID",
  appId: "REPLACE_WITH_YOUR_APP_ID"
};
// ===== END CONFIG =====

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.getGPS = function(){
 const t=document.getElementById('gpsText');
 t.innerText="Getting location...";
 navigator.geolocation.getCurrentPosition(pos=>{
   const lat=pos.coords.latitude, lon=pos.coords.longitude;
   document.getElementById('maplink').value=`https://maps.google.com/?q=${lat},${lon}`;
   t.innerText=`✅ GPS: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
 }, err=>{ t.innerText="❌ GPS Failed: "+err.message; });
}

async function loadPosts(){
 const list=document.getElementById('postsList');
 try{
   const q=query(collection(db,"houses"), orderBy("createdAt","desc"));
   const snap=await getDocs(q);
   if(snap.empty){ list.innerHTML="No posts yet. Be first to post!"; return; }
   list.innerHTML="";
   snap.forEach(doc=>{
     const p=doc.data();
     list.innerHTML+=`<div class="postItem"><b>${p.title}</b> - ${p.area} - ₹${p.price}<br><small>${p.desc}</small><br><small>📍 <a href="${p.maplink}" target="_blank">Map</a> | UPI:${p.upi} | Phone:${p.phone}<br>${p.time||''}</small></div>`;
   });
 }catch(e){ list.innerHTML="Error loading: "+e.message+"<br>Check Firestore Rules - set to Test Mode"; }
}
loadPosts();

document.getElementById('postBtn').onclick = async ()=>{
 const title=document.getElementById('title').value.trim();
 const desc=document.getElementById('desc').value.trim();
 const area=document.getElementById('area').value.trim();
 const price=document.getElementById('price').value.trim();
 const maplink=document.getElementById('maplink').value.trim();
 const upi=document.getElementById('upi').value.trim();
 const phone=document.getElementById('phone').value.trim();
 const status=document.getElementById('status');

 if(!title){ alert("Enter Title"); return; }
 if(!area){ alert("Enter Area"); return; }
 if(!upi){ alert("Enter UPI"); return; }

 status.style.color="orange";
 status.innerText="⏳ Posting to Everyone...";
 try{
   await addDoc(collection(db,"houses"), {title,desc,area,price,maplink,upi,phone,time:new Date().toLocaleString(), createdAt: serverTimestamp()});
   status.style.color="green";
   status.innerText="✅ POSTED! Everyone can see now!";
   alert("✅ SUCCESS! Now EVERYONE can see your post!");
   document.getElementById('title').value="";
   document.getElementById('desc').value="";
   loadPosts();
 }catch(e){
   status.style.color="red";
   status.innerText="❌ Failed: "+e.message;
   alert("Failed: "+e.message+"\n\nMake sure Firestore is in TEST MODE");
 }
};

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
