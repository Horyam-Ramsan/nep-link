<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEP LINK - Customers, Shops & Houses</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Outfit',sans-serif}</style>
</head>
<body class="bg-gradient-to-br from-emerald-600 to-teal-700 min-h-screen">
<div class="max-w-5xl mx-auto p-4">
<h1 class="text-4xl font-bold text-white text-center mt-8">NEP LINK 🏠H🛒</h1>
<p class="text-white/80 text-center mt-2">Connect Customers, Shopkeepers & House Owners</p>

<div class="bg-white rounded-2xl p-6 mt-8 shadow-2xl">
<h2 class="font-bold text-xl">Add Your Listing</h2>

<select id="role" class="w-full border p-3 rounded-xl mt-4 font-semibold">
<option value="Customer">I am a Customer - Looking for Shop/House</option>
<option value="Shopkeeper">I am a Shopkeeper - I have a Shop</option>
<option value="House Owner">I am a House Owner - I have House/Room for Rent</option>
</select>

<input id="name" placeholder="Your Full Name" class="w-full border p-3 rounded-xl mt-3">
<input id="phone" placeholder="Phone / WhatsApp Number" class="w-full border p-3 rounded-xl mt-3">
<input id="location" placeholder="Location / Area (e.g. Delhi, Laxmi Nagar)" class="w-full border p-3 rounded-xl mt-3">
<input id="details" placeholder="Details: For Shop - Shop name & items. For House - Rent, BHK. For Customer - What you need" class="w-full border p-3 rounded-xl mt-3">
<input id="price" placeholder="Price / Rent (e.g. 5000/month) - Leave empty if customer" class="w-full border p-3 rounded-xl mt-3">

<button id="saveBtn" class="w-full bg-emerald-600 text-white p-3 rounded-xl mt-4 font-bold hover:bg-emerald-700">Publish Listing 🚀</button>
<p id="status" class="text-center mt-3 text-sm font-semibold"></p>
</div>

<div class="flex gap-2 mt-6 justify-center">
<button onclick="filterRole('All')" class="bg-white px-4 py-2 rounded-full text-sm font-bold">All</button>
<button onclick="filterRole('House Owner')" class="bg-white px-4 py-2 rounded-full text-sm font-bold">🏠 Houses</button>
<button onclick="filterRole('Shopkeeper')" class="bg-white px-4 py-2 rounded-full text-sm font-bold">🛒 Shops</button>
<button onclick="filterRole('Customer')" class="bg-white px-4 py-2 rounded-full text-sm font-bold">👤 Customers</button>
</div>

<div class="bg-white rounded-2xl p-6 mt-4 shadow-2xl">
<h2 class="font-bold text-xl">Latest Listings</h2>
<div id="profiles" class="mt-4 grid md:grid-cols-2 gap-3">Loading...</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDdcmCz5GFUPIz18QEa_xe3bpT4LX0Ze6I",
  authDomain: "nep-link-9b254.firebaseapp.com",
  projectId: "nep-link-9b254",
  storageBucket: "nep-link-9b254.firebasestorage.app",
  messagingSenderId: "1070476104406",
  appId: "1:1070476104406:web:b99d58cd0e1140cc39ef77"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let allData = [];

document.getElementById('saveBtn').onclick = async () => {
  const role = document.getElementById('role').value;
  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  const location = document.getElementById('location').value;
  const details = document.getElementById('details').value;
  const price = document.getElementById('price').value;
  if(!name || !phone || !location){ alert('Name, Phone & Location required'); return; }
  document.getElementById('status').innerText = 'Publishing...';
  try {
    await addDoc(collection(db, "listings"), { role, name, phone, location, details, price, createdAt: serverTimestamp() });
    document.getElementById('status').innerText = '✅ Listing Published!';
    document.getElementById('name').value='';document.getElementById('phone').value='';document.getElementById('location').value='';document.getElementById('details').value='';document.getElementById('price').value='';
    loadProfiles();
  } catch(e){ document.getElementById('status').innerText = 'Error: ' + e.message; }
};

async function loadProfiles(){
  const snap = await getDocs(query(collection(db, "listings"), orderBy("createdAt","desc")));
  allData = [];
  snap.forEach(d => allData.push({id:d.id, ...d.data()}));
  renderList(allData);
}

window.filterRole = (role) => {
  if(role==='All') renderList(allData);
  else renderList(allData.filter(x=>x.role===role));
}

function renderList(list){
  const div = document.getElementById('profiles');
  div.innerHTML = '';
  if(list.length===0){ div.innerHTML='No listings yet. Be first!'; return; }
  list.forEach(p => {
    let icon = p.role==='House Owner' ? '🏠' : p.role==='Shopkeeper' ? '🛒' : '👤';
    let color = p.role==='House Owner' ? 'bg-orange-100' : p.role==='Shopkeeper' ? 'bg-blue-100' : 'bg-green-100';
    div.innerHTML += `<div class="border p-4 rounded-xl ${color}"><div class="flex justify-between"><b>${icon} ${p.name}</b><span class="text-xs bg-black text-white px-2 py-1 rounded-full">${p.role}</span></div><div class="mt-2 text-sm">📍 ${p.location}<br>📞 ${p.phone}<br>${p.price? '💰 '+p.price+'<br>':''}📝 ${p.details||''}</div><a href="https://wa.me/91${p.phone}" target="_blank" class="mt-3 inline-block bg-green-600 text-white px-3 py-1 rounded-full text-xs">WhatsApp</a></div>`;
  });
}
loadProfiles();
</script>
</body>
</html>
